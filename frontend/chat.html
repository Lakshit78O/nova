<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Chat with Nova</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=IBM+Plex+Mono:wght@500&display=swap" rel="stylesheet">

<link rel="stylesheet" href="css/variables.css" />
<link rel="stylesheet" href="css/style.css" />
<link rel="stylesheet" href="css/chat.css" />

<!-- Markdown parser: renders the Markdown Mistral Nemo returns -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/12.0.2/marked.min.js"></script>
<!-- Sanitizer: strips any unsafe HTML before it's injected into the page -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.1.6/purify.min.js"></script>
<!-- Syntax highlighting for fenced code blocks -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/atom-one-dark.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
</head>
<body class="chat-body">

<header class="chat-header">
  <a href="index.html" class="chat-header__brand" aria-label="Back to Nova home">
    <span class="nova-mark" style="--size:24px;" aria-hidden="true">
      <span class="nova-mark__ray"></span><span class="nova-mark__ray"></span>
      <span class="nova-mark__ray"></span><span class="nova-mark__ray"></span>
      <span class="nova-mark__core"></span>
    </span>
    <span class="wordmark" style="font-size:16px;">Nova</span>
  </a>

  <span class="chat-header__status">
    <span class="status-dot" id="status-dot"></span>
    <span id="status-text">Ready</span>
  </span>

  <div class="chat-header__actions">
    <button class="icon-btn" id="clear-btn" title="Start a new conversation" aria-label="Start a new conversation">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 12a8 8 0 1 0 2.3-5.7M4 4v4h4"/></svg>
    </button>
  </div>
</header>

<main class="chat-scroll" id="chat-scroll">
  <div class="chat-transcript" id="chat-transcript">
    <!-- Empty state, replaced once the first message is sent -->
    <div class="chat-welcome" id="chat-welcome">
      <span class="nova-mark" aria-hidden="true">
        <span class="nova-mark__ray"></span><span class="nova-mark__ray"></span>
        <span class="nova-mark__ray"></span><span class="nova-mark__ray"></span>
        <span class="nova-mark__core"></span>
      </span>
      <h2>What's on your mind?</h2>
      <p>Ask Nova anything — it streams its answer live, formatted and ready to read.</p>
      <div class="chat-welcome__prompts">
        <button class="prompt-chip" data-prompt="Explain how async/await works in JavaScript, with a short example.">Explain async/await</button>
        <button class="prompt-chip" data-prompt="Give me a 3-day itinerary for a first trip to Kyoto.">Plan a Kyoto trip</button>
        <button class="prompt-chip" data-prompt="Write a Python function that checks if a string is a palindrome.">Write a palindrome check</button>
      </div>
    </div>
  </div>
</main>

<div class="chat-error" id="chat-error" role="alert"></div>

<footer class="composer">
  <form class="composer__inner" id="composer-form">
    <textarea
      id="chat-input"
      rows="1"
      placeholder="Message Nova…"
      aria-label="Message Nova"
    ></textarea>
    <button type="submit" class="send-btn" id="send-btn" disabled aria-label="Send message">
      <svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M5 12h14M13 5l7 7-7 7"/></svg>
    </button>
  </form>
  <p class="composer__hint">Nova can make mistakes. Verify anything important. · Enter to send, Shift+Enter for a new line</p>
</footer>

<script src="js/chat.js"></script>
</body>
</html>
